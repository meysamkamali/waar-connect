<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>waar Connect · phase 0</title>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body class="page">
    <header class="row" style="align-items: center; gap: 16px">
      <img class="logo" src="/logo.svg" alt="waar Connect" />
      <h1>Phase 0 test pages</h1>
    </header>

    <section class="card" style="margin-bottom: 16px">
      <h2 style="margin: 0 0 8px">Staff screens</h2>
      <div class="row">
        <a class="btn" href="/app/producer">Producer</a>
        <a class="btn secondary" href="/app/engineer">Engineer</a>
      </div>
      <p class="help">Sign in with your staff account. Guests use the link the producer sends them.</p>
    </section>

    <form class="card" id="form">
      <label>
        PIN
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" required />
      </label>
      <label>
        Room
        <input id="room" type="text" pattern="[a-z0-9][a-z0-9\-]{0,31}" value="test" required />
      </label>
      <label>
        Your name (guests)
        <input id="name" type="text" maxlength="40" placeholder="e.g. Rebwar" />
      </label>
      <div class="row">
        <button class="btn" type="submit" data-go="guest">Join as guest</button>
        <button class="btn secondary" type="submit" data-go="studio">Studio return</button>
        <button class="btn secondary" type="submit" data-go="monitor">Monitor</button>
        <button class="btn secondary" type="submit" data-go="clock">Clock</button>
      </div>
      <p class="help" id="message"></p>
      <div class="help" id="outlink" hidden>
        Output page for this guest:<br />
        <code id="outurl"></code>
        <div class="row" style="margin-top: 8px">
          <button class="btn secondary" type="button" id="copy">Copy</button>
          <button class="btn secondary" type="button" id="open">Open</button>
        </div>
      </div>
      <p class="help">
        Guest options on the URL: <code>res=720|540|360</code>, <code>fps=25|30</code>, <code>kbps=2500</code>,
        <code>codec=h264|vp8</code>, <code>relay=1</code>. Out page: <code>buffer=400</code>, <code>clock=1</code>,
        <code>stats=1</code>.
      </p>
    </form>

    <footer data-footer></footer>
    <script type="module" src="/src/pages/index.ts"></script>
  </body>
</html>
