# waar Connect on the VM: TLS for two names, on two ports.
#   8443  the port the station router forwards from the internet; guest links carry it.
#   443   inside the station only, where the LAN DNS points the names straight at this VM:
#         https://connect.waar.work with no port. The router does not forward 443 (or 80) here;
#         from the internet those two ports belong to the aaPanel server.
#   80    inside the station only: redirects to HTTPS.
# Certificates are copied from the aaPanel server into /etc/waar-connect/certs (certsync-to-vm.sh);
# waar-certs.path reloads Nginx when they change.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# An address typed without https:// (inside the station) lands on the HTTPS page.
server {
    listen 80;
    listen [::]:80;
    server_name connect.waar.work connect.waarmedia.com media.connect.waar.work;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Pages and API
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name connect.waar.work connect.waarmedia.com;

    ssl_certificate     /etc/waar-connect/certs/connect.waar.work/fullchain.pem;
    ssl_certificate_key /etc/waar-connect/certs/connect.waar.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WC:10m;
    server_tokens off;

    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The first page of the site is the phase 1 landing (/app/). The phase 0 test page, which used to
    # answer here, stays reachable at /index.html; its other pages (guest.html, out.html, ...) are untouched.
    location = / {
        return 302 /app/;
    }
    # /app without the slash used to answer 404.
    location = /app {
        return 302 /app/;
    }

    # The phase 1 web app (apps/web), static files built by Vite with base /app/.
    location /app/assets/ {
        alias /opt/waar-connect/apps/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location /app/ {
        alias /opt/waar-connect/apps/web/dist/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    }

    # The phase 1 API (apps/api). Everything else still goes to the phase 0 app below.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }
}

# LiveKit signaling (WebSocket) and server API
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.connect.waar.work;

    ssl_certificate     /etc/waar-connect/certs/media.connect.waar.work/fullchain.pem;
    ssl_certificate_key /etc/waar-connect/certs/media.connect.waar.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WC:10m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 16m;
    }
}
