# waar Connect on the VM: TLS on 8443 for two names.
# Certificates are copied from the aaPanel server into /etc/waar-connect/certs (certsync-to-vm.sh);
# waar-certs.path reloads Nginx when they change.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pages and API
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name connect.waar.work connect.waarmedia.com;

    ssl_certificate     /etc/waar-connect/certs/connect.waar.work/fullchain.pem;
    ssl_certificate_key /etc/waar-connect/certs/connect.waar.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WC:10m;
    server_tokens off;

    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }
}

# LiveKit signaling (WebSocket) and server API
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name media.connect.waar.work;

    ssl_certificate     /etc/waar-connect/certs/media.connect.waar.work/fullchain.pem;
    ssl_certificate_key /etc/waar-connect/certs/media.connect.waar.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WC:10m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 16m;
    }
}
