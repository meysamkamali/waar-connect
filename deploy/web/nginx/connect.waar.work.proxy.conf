# waar Connect: main site -> Node token server and pages on 127.0.0.1:8787.
# Installed as /www/server/panel/vhost/nginx/proxy/connect.waar.work/waarconnect_connect.waar.work.conf
# "^~" sends everything to the app, ahead of aaPanel's regex locations for static files;
# the panel's /.well-known/ prefix location is longer and still wins for certificate renewals.

#PROXY-START/
location ^~ /
{
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    client_max_body_size 8m;

    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
#PROXY-END/
